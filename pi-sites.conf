map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080 ssl;
    listen [::]:8080 ssl;
    server_name _;

    ssl_certificate /data/sites/certs/pi-sites.crt;
    ssl_certificate_key /data/sites/certs/pi-sites.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20G;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 8081 ssl;
    listen [::]:8081 ssl;
    listen 8086 ssl;
    listen [::]:8086 ssl;
    server_name _;
    root /data/sites/blog/html;
    index index.html;

    ssl_certificate /data/sites/certs/pi-sites.crt;
    ssl_certificate_key /data/sites/certs/pi-sites.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /admin {
        allow 127.0.0.1;
        allow 192.168.31.0/24;
        deny all;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /uploads/ {
        alias /data/blog-backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

server {
    listen 18080;
    listen [::]:18080;
    server_name _;
    return 301 https://$host:8080$request_uri;
}

server {
    listen 18081;
    listen [::]:18081;
    server_name _;
    return 301 https://$host:8086$request_uri;
}
